# Server runtime parameters (optional; can be overridden by environment variables).
server:
  host: 0.0.0.0
  port: 8000
  transport: http
  # Public base URL clients use to reach this server.
  # Required (here or via RCM_PUBLIC_BASE_URL).
  public_base_url: https://rcm.example.com

  # Optional native HTTPS. Omit this block for HTTP or a reverse-proxy setup.
  # tls:
  #   enabled: true
  #   auto_generate: true
  #   # Additional DNS names or IP addresses for the generated certificate.
  #   hostnames: [rcm.internal.example.com]
  # For manually managed certificates, use cert_file and key_file instead.

# Optional auth block. RCM_API_KEY env var takes precedence.
# auth:
#   api_key: change-me

# To run as a local proxy instead of a command server, use this shape. The
# target names are direct children of `proxy`; proxied tools are exposed as
# <target>__<tool>.
# mode: proxy
# commands: []
# proxy:
#   # Remote-config targets discover the transport from the remote YAML.
#   remote_compile:
#     ssh:
#       host: compile-machine
#     config: /etc/rcm/commands.yaml
#     sync:
#       enabled: true
#   compile:
#     transport: ssh
#     ssh:
#       host: compile-machine
#       command: [rcm, --stdio]
#     sync:
#       source: /home/me/project
#       destination: /srv/project
#       excludes: [".git/**", "build/**", "**/*.pyc"]
#       delete: false
#   local_tools:
#     transport: stdio
#     command: [uv, run, my-local-mcp]
#   remote_tools:
#     transport: http
#     endpoint: https://remote.example.com/mcp
#     headers:
#       Authorization:
#         env: REMOTE_MCP_AUTH

# Optional defaults applied to every command.
defaults:
  timeout: 30          # seconds
  cwd: /var/log        # working directory

commands:
  - name: disk_usage
    description: Show disk usage of mounted filesystems.
    command: ["df", "-h"]

  - name: tail_log
    description: Tail the last N lines of a log file under /var/log.
    command: ["tail", "-n", "{lines}", "/var/log/{file}"]
    params:
      lines:
        type: integer
        description: Number of lines to read.
        default: 100
      file:
        type: string
        description: Filename under /var/log (no slashes allowed).
        pattern: '^[A-Za-z0-9._-]+$'

  - name: uptime_info
    description: Print system uptime and load average.
    command: ["uptime"]
    timeout: 5
