[project]
name = "rcm"
version = "0.1.0"
description = "Remote Command MCP Server with MCP proxy support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43",
    "fastmcp>=2.0",
    "mcp-proxy>=0.12,<0.13",
    "pyyaml>=6",
]

[project.scripts]
rcm = "rcm.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "importlib-metadata>=7",
    "nuitka>=2.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["rcm"]
