[project]
name = "rcm"
version = "0.1.0"
description = "Remote Command MCP Server with optional WebDAV support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2wsgi>=1.10",
    "fastmcp>=2.0",
    "pyyaml>=6",
    "wsgidav>=4.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "importlib-metadata>=7",
    "nuitka>=2.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
